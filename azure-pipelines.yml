trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
# 1. COMPILACIÓN
- stage: Build
  displayName: 'Compilación Flutter Web'
  jobs:
  - job: BuildJob
    steps:
    - script: |
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 $(Agent.TempDirectory)/flutter
        echo "##vso[task.prependpath]$(Agent.TempDirectory)/flutter/bin"
      displayName: 'Instalar Flutter'

    - script: |
        flutter --version
        flutter config --enable-web
        flutter pub get
        flutter build web --release
      displayName: 'Compilar Flutter Web'
      # Si tu pubspec.yaml no está en la raíz, agrega:
      # workingDirectory: 'NOMBRE_DE_LA_CARPETA'

    # Necesario para que las rutas de la SPA funcionen en IIS (App Service Windows)
    - script: |
        cat > build/web/web.config << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration>
          <system.webServer>
            <rewrite>
              <rules>
                <rule name="Flutter SPA" stopProcessing="true">
                  <match url=".*" />
                  <conditions logicalGrouping="MatchAll">
                    <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                  </conditions>
                  <action type="Rewrite" url="/index.html" />
                </rule>
              </rules>
            </rewrite>
            <staticContent>
              <remove fileExtension=".wasm" />
              <mimeMap fileExtension=".wasm" mimeType="application/wasm" />
            </staticContent>
          </system.webServer>
        </configuration>
        EOF
      displayName: 'Agregar web.config'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'build/web'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2. DESPLIEGUE
- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'ApparelMovil-Connection'
        appType: 'webApp'
        appName: 'ApparelMovil-Front'
        package: '$(System.ArtifactsDirectory)/drop/app.zip'